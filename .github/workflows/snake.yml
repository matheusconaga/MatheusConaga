name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%231F6FEB&color_dots=%23161B22,%230D419D,%231F6FEB,%2359A6EC,%2393C5FD

            dist/github-snake.svg?color_snake=%231F6FEB&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
