name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: matheusconaga

          outputs: |
            dist/github-snake.svg?color_snake=%2359A6EC&color_dots=%23161B22,%231f2937,%233b82f6,%2359A6EC,%23ffffff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2359A6EC&color_dots=%230D1117,%231f2937,%233b82f6,%2359A6EC,%23ffffff

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
